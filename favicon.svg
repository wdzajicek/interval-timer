<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .frame { stroke: #0f172a; }
    .sand { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #f8fafc; }
      .sand { fill: #3b82f6; }
    }
  </style>
  <!-- Top & bottom sand -->
  <path class="sand" d="M10.5 9.5h11l-5.5 6.5-5.5-6.5zm5.5 11l-6.5 6.5h13L16 20.5z" />
  <!-- Falling sand stream -->
  <line class="sand" x1="16" y1="16" x2="16" y2="21.5" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />
  <!-- Glass bulb outline -->
  <path class="frame" fill="none" stroke-width="2.25" stroke-linejoin="round" d="M8 5h16v3.5L16 16l8 7.5V27H8v-3.5l8-7.5-8-7.5V5z" />
  <!-- Top & bottom caps -->
  <line class="frame" x1="6.5" y1="5" x2="25.5" y2="5" stroke-width="2.5" stroke-linecap="round" />
  <line class="frame" x1="6.5" y1="27" x2="25.5" y2="27" stroke-width="2.5" stroke-linecap="round" />
</svg>
